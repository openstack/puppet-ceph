---
security:
  - |
    The secrets managed by this module are now always handled as
    ``Sensitive`` values, so that they are redacted in puppet logs, reports
    and the catalog. This applies to the following parameters:

    * ``secret`` of ``ceph::key``, including the keys created via
      ``ceph::keys`` and ``ceph::profile::params::client_keys``
    * ``key`` of ``ceph::mon``
    * ``key`` of ``ceph::mgr``
    * ``rgw_keystone_admin_password`` of ``ceph::rgw::keystone``
    * ``rgw_keystone_barbican_password`` of ``ceph::rgw::barbican``
    * ``mds_key``, ``mon_key``, ``mgr_key`` and
      ``rgw_keystone_admin_password`` of ``ceph::profile::params``

    Wrap the value passed to these parameters in ``Sensitive`` to also
    redact the parameter itself in the catalog.
  - |
    The error raised by ``ceph::mon`` when both ``key`` and ``keyring`` are
    set no longer includes the key.
features:
  - |
    The parameters listed above, as well as the ``password`` parameter of
    ``ceph::rgw::keystone::auth``, now accept values wrapped in
    ``Sensitive``. Note that ``ceph::rgw::keystone::auth`` passes the
    password on to ``keystone::resource::service_identity`` as a plain
    string, because that resource does not accept a ``Sensitive`` value.
upgrade:
  - |
    The ``ceph-key-*`` exec resources declared by ``ceph::key`` and the
    ``create-keyring-*`` exec resources declared by ``ceph::mon`` now run
    with a ``Sensitive`` command, so puppet redacts the command and its
    output in logs and reports.
  - |
    The ``rgw_keystone_admin_password`` parameter of ``ceph::rgw::keystone``,
    the ``rgw_keystone_barbican_password`` parameter of
    ``ceph::rgw::barbican``, the ``password`` parameter of
    ``ceph::rgw::keystone::auth`` and the ``mds_key``, ``mon_key``,
    ``mgr_key`` and ``rgw_keystone_admin_password`` parameters of
    ``ceph::profile::params`` are now typed and require a non-empty string,
    or a ``Sensitive`` wrapping a string.
